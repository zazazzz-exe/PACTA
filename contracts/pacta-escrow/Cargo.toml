[package]
name = "pacta-escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
doctest = false

[features]
# Testnet-only build: shortens MIN_DURATION so live demo Pacts can reach
# Emergency Refund quickly. NEVER enable for a mainnet build.
testnet = []

[dependencies]
soroban-sdk = "26"

[dev-dependencies]
soroban-sdk = { version = "26", features = ["testutils"] }
